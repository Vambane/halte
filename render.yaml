services:
  - type: web
    name: myciti-bus-timetable
    env: python
    region: frankfurt  # or oregon/singapore based on preference
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn fastapi_app.main:app --host 0.0.0.0 --port $PORT --no-server-header
    envVars:
      - key: ESP_API_KEY
        sync: false  # Set manually in Render dashboard
      - key: PYTHON_VERSION
        value: 3.11
      # Hides uvicorn's Server banner even when the dashboard start command
      # lacks --no-server-header (the live service was not made from this file).
      - key: UVICORN_SERVER_HEADER
        value: "false"
    healthCheckPath: /health  # fast; non-200 until the DuckDB pool is ready
    autoDeploy: true

# Optional: If you want to rebuild the database on deploy
# buildCommand: |
#   pip install -r requirements.txt
#   python run_etl.py || echo "Using snapshot - ETL failed but continuing"
